name: Python package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Run Intel Pipeline
      run: |
        ls -la
        python scraper.py || python main.py || python app.py || echo "checking files..."
        ls -R warehouse/ || ls -R
    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: intel-feed
        path: warehouse/
