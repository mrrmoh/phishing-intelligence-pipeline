name: Python application

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas || true
    - name: Run Intel
      run: |
        python -c "import os; os.makedirs('warehouse', exist_ok=True)"
        python scraper.py || python main.py || echo "Running fallback"
        ls -R
        cat blocklist.txt || echo "no blocklist"
    - name: Upload Intel
      uses: actions/upload-artifact@v4
      with:
        name: intel-feed
        path: |
          blocklist.txt
          warehouse/
